<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel</title>
    <link rel="stylesheet" href="static/style_admin.css" />
    <script src="static/script_admin.js" defer></script>
  </head>
  <body>
    <div class="admin-container">
      <h1>Admin Panel</h1>

      <!-- Upload Section -->
      <div class="form-section">
        <h2>Upload Document</h2>
        <form id="upload-form" enctype="multipart/form-data">
          <input
            type="file"
            id="file-upload"
            name="file"
            accept="application/pdf"
          />
          <button type="submit" id="upload-btn">
            <span id="upload-spinner" class="spinner hidden"></span>
            Upload
          </button>
        </form>
        <div id="upload-status" class="status-message"></div>
      </div>

      <!-- Delete Section -->
      <div class="form-section">
        <h2>Delete Document</h2>
        <form id="delete-form">
          <input
            type="text"
            id="file-delete"
            name="fileName"
            placeholder="Enter document name"
          />
          <button type="submit" id="delete-btn">
            <span id="delete-spinner" class="spinner hidden"></span>
            Delete
          </button>
        </form>
        <div id="delete-status" class="status-message"></div>
      </div>

      <!-- Document List Section -->
      <div class="document-list-section">
        <h2>Document List</h2>
        <ul id="document-list" class="document-list">
          <!-- Document names will be dynamically inserted here -->
        </ul>
      </div>
    </div>
  </body>
</html>
